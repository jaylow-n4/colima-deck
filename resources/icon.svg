<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Colima Deck">
  <title>Colima Deck</title>
  <defs>
    <!-- 背景: 深い藍から青緑へ -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a8f" />
      <stop offset="1" stop-color="#0e8f9f" />
    </linearGradient>
    <!-- 背景の上部に入れる柔らかい光 -->
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#c7d4ee" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04112e" flood-opacity="0.35" />
    </filter>
    <!-- アイコン全体の落ち影（余白の中に収まる大きさ） -->
    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="led" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" />
    </filter>

    <!-- コンテナ 1 個分（200 x 140）。色は <use> の color で指定する -->
    <symbol id="box" viewBox="0 0 200 140" width="200" height="140">
      <rect width="200" height="140" rx="16" fill="currentColor" />
      <!-- 波板のリブ -->
      <g stroke="#0b1b4d" stroke-opacity="0.16" stroke-width="7" stroke-linecap="round">
        <path d="M44 30V110M72 30V110M100 30V110M128 30V110M156 30V110" />
      </g>
      <!-- 上端のハイライト -->
      <rect x="6" y="6" width="188" height="10" rx="5" fill="#ffffff" fill-opacity="0.45" />
    </symbol>
  </defs>

  <!-- macOS のアイコングリッドに合わせ、図柄を 824px（1024 の約 80%）に収める。
       外周 100px は Dock での見た目と影のための透明な余白。 -->
  <g transform="translate(100 100) scale(0.8047)">
  <!-- アイコンの土台（macOS 風の角丸） -->
  <rect width="1024" height="1024" rx="229" fill="url(#bg)" filter="url(#icon-shadow)" />
  <rect width="1024" height="1024" rx="229" fill="url(#glow)" />

  <g filter="url(#shadow)">
    <!-- 下段 -->
    <use href="#box" x="192" y="536" color="#ffffff" />
    <use href="#box" x="412" y="536" color="#8fe3f0" />
    <use href="#box" x="632" y="536" color="#ffffff" />
    <!-- 中段 -->
    <use href="#box" x="302" y="386" color="#8fe3f0" />
    <use href="#box" x="522" y="386" color="#ffffff" />
    <!-- 上段 -->
    <use href="#box" x="412" y="236" color="#ffffff" />
  </g>

  <!-- デッキ（甲板） -->
  <g filter="url(#shadow)">
    <rect x="152" y="696" width="720" height="64" rx="32" fill="url(#deck)" />
  </g>
  <!-- デッキ上のインジケーター -->
  <circle cx="214" cy="728" r="11" fill="#2b3a8f" fill-opacity="0.35" />
  <circle cx="254" cy="728" r="11" fill="#2b3a8f" fill-opacity="0.35" />
  <circle cx="294" cy="728" r="11" fill="#2b3a8f" fill-opacity="0.35" />

  <!-- 稼働中を示す LED（上段のコンテナ） -->
  <circle cx="568" cy="278" r="26" fill="#3ddc84" filter="url(#led)" />
  <circle cx="568" cy="278" r="15" fill="#3ddc84" />
  <circle cx="563" cy="272" r="5" fill="#ffffff" fill-opacity="0.7" />
  </g>
</svg>
